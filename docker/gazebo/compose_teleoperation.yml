services:

  gazebo:
    extends:
      file: compose.yml
      service: gazebo
    environment:
      PYTHONUNBUFFERED: 1
      ROS_DOMAIN_ID: $ROS_DOMAIN_ID
      GAZEBO_ROBOT_TOPIC_NAME: "ur3e"

  teleoperation:
    extends:
      file: ../teleoperation/compose.yml
      service: teleoperation
    environment:
      PYTHONUNBUFFERED: 1
      ROS_DOMAIN_ID: $ROS_DOMAIN_ID
